    <link rel="canonical" href="https://casrose.co.uk/" />

    <!-- Link previews (WhatsApp, iMessage, Slack, LinkedIn, Facebook).
         Each tag is kept on a single line: some scrapers parse with line-based
         regexes rather than a real HTML parser and miss tags split across lines.
         og:image must be an absolute URL to a real file - scrapers do not follow
         data: URIs, so this one asset stays external while everything else on
         the page is inlined. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Casrose" />
    <meta property="og:url" content="https://casrose.co.uk/" />
    <meta property="og:title" content="Casrose - Rise Together" />
    <meta property="og:description" content="AI Automation Ecosystem Service for Business Owners, Founders, and Conscious Leaders." />
    <meta property="og:image" content="https://casrose.co.uk/og-image.png" />
    <meta property="og:image:secure_url" content="https://casrose.co.uk/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Casrose rose emblem" />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Casrose - Rise Together" />
    <meta name="twitter:description" content="AI Automation Ecosystem Service for Business Owners, Founders, and Conscious Leaders." />
