name: Build and deploy to Hostinger

# Every push to main rebuilds the site from source and uploads it over FTP.
# Nothing here needs Hostinger's Git feature, so it works on any plan.
on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run a deploy by hand from the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: |
          npm ci
          npm install --no-save sharp png-to-ico

      # GitHub runners ship with PHP, so the endpoint gets syntax-checked on
      # every push. A typo here would 500 the contact form instead of emailing.
      - name: Lint the PHP endpoint
        run: php -l contact.php

      - name: Build the site
        working-directory: app
        run: npm run site

      # Stage exactly what should live in public_html — the single self-contained
      # index.html and the .htaccess. Nothing else is served.
      - name: Stage deploy folder
        run: |
          mkdir -p deploy
          cp index.html deploy/index.html
          cp .htaccess deploy/.htaccess
          cp contact.php deploy/contact.php
          cp privacy.html deploy/privacy.html
          cp terms.html deploy/terms.html
          cp data-deletion.html deploy/data-deletion.html
          ls -la deploy

      - name: Fail if the build produced nothing
        run: |
          size=$(stat -c%s deploy/index.html)
          echo "index.html is $size bytes"
          if [ "$size" -lt 100000 ]; then
            echo "::error::index.html is suspiciously small - refusing to deploy"
            exit 1
          fi

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          # this FTP account is rooted at the Casrose web root already,
          # so uploads go to the login directory itself
          server-dir: ./
          # only these files are managed here; anything else on the server is left alone
          exclude: |
            **/.git*
            **/.git*/**

      - name: Verify the live site actually updated
        run: |
          echo "Waiting a moment for the filesystem to settle..."
          sleep 10
          url="https://casrose.co.uk/?ci=${{ github.run_id }}"
          body=$(curl -sSL --max-time 30 "$url" || true)
          if echo "$body" | grep -q "casrose-hero"; then
            echo "Live site is serving the hero page."
          else
            echo "::error::casrose.co.uk did not serve the expected page after deploy."
            echo "First 400 chars of what it returned:"
            echo "$body" | head -c 400
            exit 1
          fi

      # These three URLs are registered in the Meta App Dashboard (privacy policy,
      # terms of service, data deletion instructions). Meta fetches them and rejects
      # the app settings if they 404, so a deploy that drops them must fail loudly.
      - name: Verify the legal pages are served
        run: |
          failed=0
          for page in privacy.html terms.html data-deletion.html; do
            url="https://casrose.co.uk/$page?ci=${{ github.run_id }}"
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 "$url" || echo "000")
            if [ "$code" = "200" ]; then
              echo "$page -> 200"
            else
              echo "::error::$page returned HTTP $code - Meta will reject this URL."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
